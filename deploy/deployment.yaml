apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkin-service
  namespace: checkin
  labels:
    app: checkin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkin-service
  template:
    metadata:
      labels:
        app: checkin-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: checkin-service
          image: ghcr.io/sankalpc10/saudia-checkin-demo:d4d9d249ff74ea8b7c11acaf80fbb2b041202b19
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 192Mi }
