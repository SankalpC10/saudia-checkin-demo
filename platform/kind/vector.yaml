# Ships container logs from the checkin namespace to VictoriaLogs on the host.
# Field names (kubernetes.pod_labels.app, rtf_service, rtf_tenant_id) match what the proactive agent filters on.
apiVersion: v1
kind: ServiceAccount
metadata: { name: vector, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: vector }
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: vector }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: vector }
subjects: [{ kind: ServiceAccount, name: vector, namespace: observability }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: vector-config, namespace: observability }
data:
  vector.yaml: |
    data_dir: /vector-data-dir
    sources:
      k8s:
        type: kubernetes_logs
        extra_namespace_label_selector: kubernetes.io/metadata.name=checkin
    transforms:
      enrich:
        type: remap
        inputs: [k8s]
        source: |
          parsed, err = parse_json(.message)
          if err == null {
            obj, oerr = object(parsed)
            if oerr == null {
              . = merge(., obj)
              if exists(obj.msg) { .message = obj.msg }
            }
          }
          .rtf_service = .kubernetes.pod_labels.app
          .rtf_tenant_id = "saudia-demo"
          del(.file)
          del(.source_type)
    sinks:
      victorialogs:
        type: elasticsearch
        inputs: [enrich]
        endpoints: ["http://host.docker.internal:9428/insert/elasticsearch/"]
        mode: bulk
        api_version: v8
        healthcheck: { enabled: false }
        request:
          headers:
            VL-Msg-Field: message
            VL-Time-Field: timestamp
            VL-Stream-Fields: rtf_tenant_id,rtf_service,kubernetes.pod_namespace
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: vector, namespace: observability }
spec:
  selector: { matchLabels: { app: vector } }
  template:
    metadata: { labels: { app: vector } }
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.43.1-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: config, mountPath: /etc/vector }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: data, mountPath: /vector-data-dir }
      volumes:
        - { name: config, configMap: { name: vector-config } }
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: data, emptyDir: {} }
