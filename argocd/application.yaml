apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkin-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SankalpC10/saudia-checkin-demo.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: checkin
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
