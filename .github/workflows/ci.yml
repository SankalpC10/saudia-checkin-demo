name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "argocd/**", "platform/**", "*.md"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/sankalpc10/saudia-checkin-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Bump image tag in deploy/
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" deploy/deployment.yaml
          git config user.name "checkin-ci"
          git config user.email "checkin-ci@users.noreply.github.com"
          git commit -am "deploy: checkin-service ${GITHUB_SHA::7} [skip ci]"
          git push
